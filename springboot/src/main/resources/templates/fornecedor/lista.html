<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<style> 
	        body { padding-top: 4.5rem; } 
	    </style>
</head>
<body>
    <div th:replace="fragments/menu :: menu"></div>

    <div class="container">
        <div class="bg-light p-5 rounded">
        <h1>Fornecedores</h1>
        <hr>
        <div>
            <a class="btn btn-primary" th:href="@{/fornecedores/novo}">Novo</a>
        </div>
			<div th:if="${feedback != null and !#strings.isEmpty(feedback)}" 
     class="alert alert-success alert-dismissible fade show" role="alert">
    
    <span th:text="${feedback}">Mensagem padrão.</span> 
    
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
        <table class="table table-hover">
            <thead>
                <tr>
                    <td><b>NOME FANTASIA</b></td>
                    <td><b>RAZÃO SOCIAL</b></td>
                    <td><b>CNPJ</b></td>
                    <td></td>
                    <td></td>
                </tr>
            </thead>
            <tbody>
                <tr th:each="fornecedor : ${fornecedores}">
                    <td th:text="${fornecedor.cnpj}"></td>
                    <td th:text="${fornecedor.nomeFantasia}"></td>
                    <td th:text="${fornecedor.razaoSocial}"></td>
                    <td>
                        <a class="btn btn-secondary" th:href="@{/fornecedores/edita/{id}(id=${fornecedor.id})}">Editar</a>
                    </td>
                    <td>
                        <a class="btn btn-secondary"  th:if="${fornecedor.ativo == false}" 
                           th:href="@{/fornecedores/ativa/{id}(id=${fornecedor.id})}">Ativar</a>
                        <a class="btn btn-secondary" th:unless="${fornecedor.ativo == false}" 
                           th:href="@{/fornecedores/inativa/{id}(id=${fornecedor.id})}">Inativar</a>
                    </td>
                </tr>
            </tbody>
        </table>
        	</div>
        </div>
        
    
</body>
</html>
